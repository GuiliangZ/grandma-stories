<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FFF7EE">
  <title>奶奶的故事</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 选人：第一次打开，或者点「换人」 -->
  <section class="screen" id="screen-user">
    <div class="grow">
      <h1 class="greeting center-text">请问您是哪一位？</h1>
      <p class="sub center-text">点自己的名字，或者新建一个</p>
      <div class="stack" id="user-list"></div>
      <p class="empty-note" id="user-empty" hidden>还没有人用过，先新建一个名字吧</p>
    </div>
    <div class="stack">
      <button class="btn primary" id="btn-user-new" type="button" data-say="new_user">➕ 新建我的名字</button>
    </div>
  </section>

  <!-- 新建名字 -->
  <section class="screen" id="screen-user-new">
    <div class="topbar"><button class="back" id="btn-user-new-back" type="button" data-say="back">‹ 返回</button></div>
    <div class="grow center">
      <h1 class="greeting">请输入您的名字</h1>
      <input class="bigfield" id="user-name-input" type="text" maxlength="12" placeholder="比如：奶奶" autocomplete="off">
      <p class="status" id="user-name-error"></p>
    </div>
    <div class="stack">
      <button class="btn green" id="btn-user-create" type="button" data-say="ok">✅ 好了</button>
    </div>
  </section>

  <!-- 密码：新建名字时设一个；以后选这个人要输对才能进 -->
  <section class="screen" id="screen-password">
    <div class="topbar"><button class="back" id="btn-password-back" type="button" data-say="back">‹ 返回</button></div>
    <div class="grow center">
      <h1 class="greeting" id="password-title">请输入密码</h1>
      <p class="sub" id="password-sub"></p>
      <input class="bigfield" id="password-input" type="text" inputmode="numeric" maxlength="20" placeholder="至少 4 位" autocomplete="off" autocapitalize="off">
      <p class="status" id="password-error"></p>
    </div>
    <div class="stack">
      <button class="btn green" id="btn-password-ok" type="button" data-say="ok">✅ 好了</button>
    </div>
  </section>

  <!-- 首页 -->
  <section class="screen active" id="screen-home">
    <div class="topbar">
      <span class="tag" id="home-user"></span>
      <button class="back" id="btn-switch-user" type="button" data-say="switch_user">换人 ›</button>
    </div>
    <div class="grow center">
      <div class="hero">👵</div>
      <h1 class="greeting"><span class="name">奶奶</span>，您好</h1>
      <p class="sub">今天想听您讲讲以前的事</p>
      <p class="count" id="home-count">还没有开始讲，今天就开始吧</p>
    </div>
    <div class="stack">
      <button class="btn primary" id="btn-start" type="button" data-say="start">🎙️ 开始讲故事</button>
      <button class="btn secondary" id="btn-continue-last" type="button" data-say="continue_last" hidden>🔁 接着讲上次的问题</button>
      <button class="btn secondary" id="btn-list" type="button" data-say="list">📖 听听讲过的故事</button>
      <button class="btn secondary" id="btn-my-topic" type="button" data-say="my_topic">✍️ 我想讲的</button>
      <button class="btn text" id="btn-set-password" type="button" data-say="set_password">🔒 设置密码</button>
    </div>
  </section>

  <!-- 我想讲的：自己提一个题目，变成一个问题 -->
  <section class="screen" id="screen-topic">
    <div class="topbar"><button class="back" id="btn-topic-back" type="button" data-say="back">‹ 返回</button></div>
    <div class="grow center">
      <h1 class="greeting">您想讲什么？</h1>
      <p class="sub">写个题目就行，比如：我养过的那条狗</p>
      <input class="bigfield" id="topic-input" type="text" maxlength="60" placeholder="我想讲……" autocomplete="off">
      <p class="status" id="topic-error"></p>
    </div>
    <div class="stack">
      <button class="btn green" id="btn-topic-ok" type="button" data-say="ok">✅ 好了，就讲这个</button>
    </div>
  </section>

  <!-- 问题 -->
  <section class="screen" id="screen-question">
    <div class="topbar">
      <button class="back" id="btn-q-home" type="button" data-say="home">‹ 首页</button>
      <span class="tag" id="q-stage"></span>
    </div>
    <div class="grow center">
      <p class="hint" id="q-progress"></p>
      <p class="question" id="q-text"></p>
      <p class="answered-note" id="q-answered" hidden>✔ 这个问题讲过了，可以再讲一次</p>
    </div>
    <div class="stack">
      <button class="btn secondary" id="btn-replay" type="button" data-say="replay">🔊 再听一遍问题</button>
      <button class="btn primary" id="btn-record" type="button" data-say="record">🎙️ 按这里，开始讲</button>
      <button class="btn text" id="btn-skip" type="button" data-say="skip">换一个问题 ›</button>
      <button class="btn text danger" id="btn-delete-question" type="button" data-say="delete_question" hidden>🗑️ 删掉这个问题</button>
    </div>
  </section>

  <!-- 录音中 -->
  <section class="screen" id="screen-recording">
    <p class="hint center-text">正在听您讲，慢慢说，不着急</p>
    <p class="question small center-text" id="rec-question"></p>
    <div class="rec-circle">🎙️</div>
    <div class="timer" id="rec-timer">00:00</div>
    <div class="transcript empty" id="rec-transcript">（您说的话会一句一句显示在这里）</div>
    <div class="stack">
      <button class="btn green" id="btn-stop" type="button">✅ 讲完了</button>
    </div>
  </section>

  <!-- 存好了：可以听、接着讲追问、下一个 -->
  <section class="screen" id="screen-saved">
    <div class="topbar"><span class="tag" id="sv-stage"></span><button class="back" id="btn-saved-home" type="button" data-say="home">首页 ›</button></div>
    <h2 class="title">✅ 存好了 <span class="muted" id="sv-duration"></span></h2>
    <p class="status" id="saved-note"></p>
    <button class="btn secondary" id="btn-play-saved" type="button">▶️ 听一听</button>
    <div class="grow center">
      <p class="hint" id="sv-followup-label" hidden>接着问：</p>
      <p class="question" id="sv-followup"></p>
    </div>
    <div class="stack">
      <button class="btn primary" id="btn-continue" type="button" data-say="continue_story">🎙️ 接着讲</button>
      <button class="btn secondary" id="btn-next" type="button" data-say="next">➡️ 下一个问题</button>
      <button class="btn text" id="btn-home-2" type="button" data-say="bye">🏠 今天先到这里</button>
    </div>
  </section>

  <!-- 讲过的故事 -->
  <section class="screen" id="screen-list">
    <div class="topbar"><button class="back" id="btn-list-back" type="button" data-say="home">‹ 首页</button></div>
    <h2 class="title">讲过的故事</h2>
    <div class="stack" id="story-list"></div>
    <p class="empty-note" id="list-empty" hidden>还没有讲过故事，回到首页开始吧</p>
  </section>

  <!-- 一个故事 -->
  <section class="screen" id="screen-detail">
    <div class="topbar">
      <button class="back" id="btn-detail-back" type="button" data-say="back">‹ 返回</button>
      <span class="tag" id="dt-stage"></span>
    </div>
    <p class="question small" id="dt-question"></p>
    <p class="meta" id="dt-meta"></p>
    <p class="status" id="dt-status"></p>
    <button class="btn secondary" id="btn-detail-play" type="button">▶️ 听一听</button>
    <div class="transcript" id="dt-transcript"></div>
    <button class="btn secondary" id="btn-detail-continue" type="button" data-say="continue_story">🎙️ 接着讲这个问题</button>
    <button class="btn text danger" id="btn-detail-delete" type="button" data-say="delete">🗑️ 删掉这段录音</button>
  </section>

  <!-- 大字弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <button class="btn primary" id="modal-ok" type="button">知道了</button>
      <button class="btn secondary" id="modal-cancel" type="button" hidden></button>
    </div>
  </div>

  <audio id="prompt-audio" preload="auto"></audio>
  <audio id="playback-audio"></audio>
  <script src="bundle.js?v=087e11fbfe"></script>
  <!-- 保险：脚本没加载好（比如微信缓存了坏文件）时，给个能看懂的提示而不是一个按不动的页面 -->
  <script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.QUESTIONS && window.Speaker && window.WavRecorder && window.StoryStore) return;
      var m = document.getElementById('modal'); if (!m) return;
      document.getElementById('modal-title').textContent = '页面出了点问题';
      document.getElementById('modal-text').textContent = '请按一下「重新打开」；还不行就让家人看看';
      document.getElementById('modal-cancel').hidden = true;
      var ok = document.getElementById('modal-ok'); ok.textContent = '重新打开'; ok.onclick = function () { location.reload(); };
      m.hidden = false;
      try { fetch('/api/client-log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'bundle-missing', detail: 'Q=' + !!window.QUESTIONS + ' S=' + !!window.Speaker + ' R=' + !!window.WavRecorder + ' D=' + !!window.StoryStore, ua: navigator.userAgent, url: location.href.replace(/token=[^&]+/, 'token=***'), at: new Date().toISOString() }) }); } catch (e) {}
    }, 2000);
  });
  </script>
</body>
</html>
